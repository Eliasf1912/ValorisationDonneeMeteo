name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  install-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: checkout frontend
        uses: actions/checkout@v4

      - name: install node and dependencies
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: "frontend/package-lock.json"
      - run: cd frontend && npm ci

      - name: run test
        run: |
          mkdir -p test-results
          cd frontend
          npx vitest --project unit --run --reporter=junit --outputFile=../test-results/frontend-junit.xml

      - name: upload frontend test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-report
          path: test-results/frontend-junit.xml
          if-no-files-found: error

      - name: run linter
        run: cd frontend && npm run lint

  install-backend:
    runs-on: ubuntu-latest
    steps:
      - name: checkout backend
        uses: actions/checkout@v4

      - name: install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: install dependencies
        run: cd backend && uv sync --group dev

      - name: run test
        run: |
          mkdir -p test-results
          cd backend
          uv run pytest weather/tests/unit --junitxml=../test-results/backend-junit.xml

      - name: upload backend test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: test-results/backend-junit.xml
          if-no-files-found: error

      - name: run linter
        run: cd backend && uv run ruff check

  Security-scan-frontend:
    needs: [install-frontend]
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - name: checkout Security
        uses: actions/checkout@v4

      - name: run trivy scan (JSON artifact)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "./frontend"
          format: "json"
          output: "trivy-frontend-report.json"

      - name: upload frontend trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-trivy-report
          path: trivy-frontend-report.json
          if-no-files-found: error

      - name: generate frontend VEX file
        env:
          REPO_SLUG: ${{ github.repository }}
        run: |
          python - "$REPO_SLUG" <<'PY'
          import json
          import sys
          from datetime import datetime, timezone

          repo = sys.argv[1].lower()
          timestamp = datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          vex = {
              "openvex": {
                  "schema": "1.0.0",
                  "id": f"urn:uuid:{repo.replace('/', '-')}-frontend-vex",
                  "author": "GitHub Actions",
                  "timestamp": timestamp,
                  "version": 1,
              },
              "products": [
                  {
                      "id": f"pkg:github/{repo}/frontend",
                      "name": "frontend",
                  }
              ],
              "statements": [
                  {
                      "product": f"pkg:github/{repo}/frontend",
                      "status": "not_affected",
                      "justification": "component_not_present",
                      "timestamp": timestamp,
                  }
              ],
          }

          with open("frontend-vex.json", "w", encoding="utf-8") as file:
              json.dump(vex, file, indent=2)
          PY

      - name: upload frontend vex artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-vex
          path: frontend-vex.json
          if-no-files-found: error

      - name: run trivy scan (SARIF)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "./frontend"
          format: "sarif"
          output: "trivy-results.sarif"

      - name: Upload results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "trivy-results.sarif"
          category: "front-end analysis"

  Security-scan-backend:
    needs: [install-backend]
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - name: checkout Security
        uses: actions/checkout@v4

      - name: run trivy scan (JSON artifact)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "./backend"
          format: "json"
          output: "trivy-backend-report.json"

      - name: upload backend trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-trivy-report
          path: trivy-backend-report.json
          if-no-files-found: error

      - name: generate backend VEX file
        env:
          REPO_SLUG: ${{ github.repository }}
        run: |
          python - "$REPO_SLUG" <<'PY'
          import json
          import sys
          from datetime import datetime, timezone

          repo = sys.argv[1].lower()
          timestamp = datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          vex = {
              "openvex": {
                  "schema": "1.0.0",
                  "id": f"urn:uuid:{repo.replace('/', '-')}-backend-vex",
                  "author": "GitHub Actions",
                  "timestamp": timestamp,
                  "version": 1,
              },
              "products": [
                  {
                      "id": f"pkg:github/{repo}/backend",
                      "name": "backend",
                  }
              ],
              "statements": [
                  {
                      "product": f"pkg:github/{repo}/backend",
                      "status": "not_affected",
                      "justification": "component_not_present",
                      "timestamp": timestamp,
                  }
              ],
          }

          with open("backend-vex.json", "w", encoding="utf-8") as file:
              json.dump(vex, file, indent=2)
          PY

      - name: upload backend vex artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-vex
          path: backend-vex.json
          if-no-files-found: error

      - name: run trivy scan (SARIF)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "./backend"
          format: "sarif"
          output: "trivy-results.sarif"

      - name: Upload results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "trivy-results.sarif"
          category: "back-end analysis"

  build-and-push-backend:
    needs: [Security-scan-backend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: login to Docker Hardened Images (dhi.io)
        uses: docker/login-action@v3
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: lowercase repo owner
        id: repo-owner
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: build and push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ steps.repo-owner.outputs.owner }}/14_valorisationdonneemeteo-backend:latest
            ghcr.io/${{ steps.repo-owner.outputs.owner }}/14_valorisationdonneemeteo-backend:${{ github.sha }}

  build-and-push-frontend:
    needs: [Security-scan-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: login to Docker Hardened Images (dhi.io)
        uses: docker/login-action@v3
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: lowercase repo owner
        id: repo-owner
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: build and push
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ steps.repo-owner.outputs.owner }}/14_valorisationdonneemeteo-frontend:latest
            ghcr.io/${{ steps.repo-owner.outputs.owner }}/14_valorisationdonneemeteo-frontend:${{ github.sha }}
